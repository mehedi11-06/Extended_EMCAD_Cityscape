# EMCAD on Cityscapes, 19 classes - primary experiment
#
# These values are the configuration of the run reported in README §7, as
# recorded in results/logs/config.json. Two settings used by that run are not
# expressible here and are noted in README §6: the auxiliary heads were kept
# at native decoder stride, and the decoder used a 10x learning-rate
# multiplier over the encoder.

# --- data ---
data_root: null                 # null -> auto-discover under /kaggle/input
crop_size: [512, 1024]          # H W; both MUST be divisible by 32
val_resize: null                # null -> evaluate at native 1024x2048
scale_min: 0.5
scale_max: 1.25                 # 2.0 resizes to 2048x4096 before cropping and
                                # drove the host out of RAM; see README §7

# --- model (lib/ is the unmodified official EMCAD) ---
encoder: pvt_v2_b2
pretrained_dir: ./pretrained_pth/pvt/
no_pretrain: false
kernel_sizes: [1, 3, 5]
expansion_factor: 2
lgag_ks: 3
activation_mscb: relu6
no_dw_parallel: false
concatenation: false

# --- supervision & loss ---
# mutation = EMCAD's default (15 loss terms); deep_supervision = 4; last_layer = 1.
# Measured costs for all three are in README §7.
supervision: deep_supervision
loss: ce_dice                   # ce | ce_dice | ce_focal | ce_dice_focal
w_ce: 0.3                       # EMCAD trainer.py:103 weighting
w_dice: 0.7
w_focal: 0.0
focal_gamma: 2.0

# --- optimization ---
batch_size: 4
grad_accum: 1                   # raise to simulate a larger batch under OOM
lr: 0.00006                     # AdamW; EMCAD uses 1e-4 at 224x224 batch 6
weight_decay: 0.01
poly_power: 0.9
warmup_iters: 500
max_iters: 10500
amp: true

# --- schedule / IO ---
val_interval: 2500
log_interval: 50
num_workers: 2
out_dir: /kaggle/working/runs/b2_single
max_hours: 8.5                  # checkpoint and stop before the session is killed
seed: 2222
deterministic: true
train_limit: null
val_limit: null
